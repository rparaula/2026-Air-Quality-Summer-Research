name: CI Tests
#Adding comment to test workflow again
on:
  push:
    branches: [main, master, Parquest-Storage]
  pull_request:
    branches: [main, master, Parquest-Storage]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Make sure code-quality checks on run on the specific files, not the entire repository
      - name: Run lint checks
        run: |
          ruff check collect.py state.py run_pipeline.py metadata_tracker.py tests

      - name: Run tests
        run: |
          python -m pytest -q